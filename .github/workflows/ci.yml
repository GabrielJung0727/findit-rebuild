name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 비용 절감을 위해 동일 PR 신규 푸시 시 이전 워크플로 cancel
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + test + Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: pub get
        run: flutter pub get

      - name: gen-l10n
        run: flutter gen-l10n

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test --reporter expanded

      - name: build APK (debug)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: client_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  server:
    name: Node server load smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: install
        run: npm ci

      - name: load smoke (require all modules)
        run: |
          node -e "
            require('./src/util/iap');
            require('./src/util/validation');
            require('./src/util/balance');
            require('./src/util/session');
            require('./src/util/recaptcha');
            require('./src/util/fcm');
            require('./src/util/protocol');
            require('./src/socket/handlers');
            require('./src/socket/server');
            require('./src/socket/ws_server');
            require('./src/routes/member');
            require('./src/routes/skills');
            require('./src/routes/economy');
            require('./src/routes/iap');
            require('./src/routes/ranks');
            require('./src/routes/ads');
            require('./src/routes/admin');
            require('./src/routes/analytics');
            require('./src/routes/fcm');
            console.log('all modules load OK');
          "
