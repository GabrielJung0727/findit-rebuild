name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 수동 실행 — 레포가 장기간 비활성이면 GitHub 이 워크플로를 잠재우므로
  # 되살릴 경로가 필요하다.
  workflow_dispatch:

# 비용 절감을 위해 동일 PR 신규 푸시 시 이전 워크플로 cancel
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test (npm workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL·Redis 통합 테스트를 CI 에서 실제로 돌리기 위한 서비스 컨테이너.
    # 이게 없으면 DATABASE_URL·REDIS_URL 이 비어 통합 테스트가 전부 skip 되고,
    # CI 초록이 "순수 로직은 맞다" 만 증명한다 — 어댑터·세션·SQL 은 아무도
    # 검증하지 않은 채 머지된다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: findit
          POSTGRES_PASSWORD: findit
          POSTGRES_DB: findit
        ports: ['5432:5432']
        # 컨테이너가 떴다는 것과 접속을 받는다는 것은 다르다. healthcheck 가
        # 없으면 첫 질의가 연결 거부로 깨진다.
        options: >-
          --health-cmd "pg_isready -U findit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://findit:findit@localhost:5432/findit
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci

      # content/images/ 는 gitignore 대상이다 (legacy/ 에서 생성하는 산출물).
      # 체크아웃만으로는 없으므로, 이미지를 서빙하는 라우트 테스트가 404 로
      # 깨진다. 약 4초 걸리고 바이트 재현 가능하므로 매 실행에 넣는다 —
      # 덤으로 Plan 1 의 추출 파이프라인이 매번 재검증된다.
      - name: content 생성
        run: npm run content:all

      # pg_isready 는 initdb 가 띄우는 임시 서버에도 통과한다. 그 직후
      # 재시작 창에서 실제 접속은 거부되므로, healthcheck 만 믿으면
      # beforeAll 이 연결 실패로 터진다. 그때 vitest JSON 은 해당 테스트를
      # pending 으로 보고해서(파일은 failed) 원인이 "skip" 처럼 보인다.
      # 실제 질의가 돌 때까지 기다린다.
      - name: PostgreSQL 실접속 대기
        run: |
          node -e '
            const { Client } = require("pg");
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              for (let i = 1; i <= 30; i += 1) {
                const c = new Client({ connectionString: process.env.DATABASE_URL });
                try {
                  await c.connect();
                  await c.query("select 1");
                  await c.end();
                  console.log(`PostgreSQL 준비됨 (${i}회째 시도)`);
                  return;
                } catch {
                  try { await c.end(); } catch {}
                  await wait(1000);
                }
              }
              console.error("PostgreSQL 이 30초 안에 접속을 받지 않았다");
              process.exit(1);
            })();
          '

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=/tmp/vitest.json

      # **skip 은 통과가 아니다.** URL 환경 변수가 비거나 서비스 컨테이너가
      # 빠지면 통합 테스트가 조용히 skip 되고, 요약은 "N passed" 로 초록이
      # 된다. 정확히 그 실패 양식을 이 저장소에서 여러 번 겪었다.
      - name: 통합 테스트가 실제로 돌았는지 확인
        run: |
          node -e '
            const r = require("/tmp/vitest.json");
            console.log(`총 ${r.numTotalTests} / 통과 ${r.numPassedTests} / skip ${r.numPendingTests}`);
            if (r.numPendingTests > 0) {
              console.error(`FAIL: ${r.numPendingTests}개가 skip 됐다. DATABASE_URL·REDIS_URL 과 서비스 컨테이너를 확인할 것.`);
              process.exit(1);
            }
          '

  flutter:
    name: analyze + test (flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci

      # app/assets/legacy 와 app/assets/audio 는 gitignore 대상 생성물이다.
      # pubspec.yaml 이 선언한 디렉터리가 없으면 pub get 이 거기서 죽는다.
      - name: 에셋 생성
        run: npm run content:all

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: pub get
        working-directory: app
        run: flutter pub get

      # 생성물이 스키마와 어긋나지 않았는지. 재생성해서 diff 가 나면 실패.
      - name: 프로토콜 드리프트
        run: |
          npm run protocol:dart
          git diff --exit-code app/lib/domain/protocol.g.dart

      - name: analyze
        working-directory: app
        run: flutter analyze

      - name: test
        working-directory: app
        run: flutter test
