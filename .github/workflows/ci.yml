name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 수동 실행 — 레포가 장기간 비활성이면 GitHub 이 워크플로를 잠재우므로
  # 되살릴 경로가 필요하다.
  workflow_dispatch:

# 비용 절감을 위해 동일 PR 신규 푸시 시 이전 워크플로 cancel
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test (npm workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci

      # content/images/ 는 gitignore 대상이다 (legacy/ 에서 생성하는 산출물).
      # 체크아웃만으로는 없으므로, 이미지를 서빙하는 라우트 테스트가 404 로
      # 깨진다. 약 4초 걸리고 바이트 재현 가능하므로 매 실행에 넣는다 —
      # 덤으로 Plan 1 의 추출 파이프라인이 매번 재검증된다.
      - name: content 생성
        run: npm run content:all

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test
