name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 수동 실행 — 레포가 장기간 비활성이면 GitHub 이 워크플로를 잠재우므로
  # 되살릴 경로가 필요하다.
  workflow_dispatch:

# 비용 절감을 위해 동일 PR 신규 푸시 시 이전 워크플로 cancel
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test (npm workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test
