name: security

# 보안 자동 검사 — secret scanning + 의존성 vuln scanning.
# Private repo 에서도 GHAS 없이 동작하는 OSS 도구만 사용.
#
# 트리거:
#   - PR (모든 add/modify diff 검사)
#   - main 푸시
#   - 매일 03:00 KST (nightly — 새로 공개된 CVE 캐치)
#   - 수동 (workflow_dispatch)
#
# 참조: SECURITY.md §11

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # cron: KST 03:00 = UTC 18:00 (전날)
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read       # gitleaks PR 코멘트
  # SECURITY.md §11 — Private repo + GHAS 미적용 → SARIF 업로드 미사용
  # 결과는 워크플로우 Artifacts 로 다운로드 (osv-scan-results)

jobs:
  # ─── 1. Secret scanning — Gitleaks ─────────────────────────────────────
  gitleaks:
    name: Gitleaks — secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 history 검사 (PR 의 add 커밋까지)

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # Pro 라이선스 사용 시
          GITLEAKS_ENABLE_COMMENTS: 'true'   # PR 에 commenting

  # ─── 2. Dependency vuln — OSV-Scanner (Google) ─────────────────────────
  osv-scan:
    name: OSV-Scanner — dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --recursive
            --skip-git
            --format=sarif
            --output=osv-results.sarif
            ./client_flutter
            ./server
            ./client_flutter/android
        continue-on-error: true

      # GHAS(Code Scanning) 미적용 private repo 에서는 SARIF 업로드 불가능
      # → SECURITY.md §11 원칙대로 OSS 도구만 사용 + 아티팩트로 전환
      # → workflow run 화면 → "Artifacts" 섹션에서 다운로드 가능
      - name: Upload SARIF as workflow artifact
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-results
          path: osv-results.sarif
          retention-days: 30
          if-no-files-found: ignore

      # 콘솔 요약 — 워크플로우 Summary 페이지에 취약점 갯수 표시
      - name: Summarize OSV findings
        if: always() && hashFiles('osv-results.sarif') != ''
        shell: bash
        run: |
          set -e
          if command -v jq >/dev/null 2>&1; then
            COUNT=$(jq '[.runs[].results[]] | length' osv-results.sarif 2>/dev/null || echo 0)
          else
            COUNT=$(grep -o '"ruleId"' osv-results.sarif | wc -l || echo 0)
          fi
          echo "## 🔍 OSV-Scanner Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -eq 0 ]; then
            echo "✅ **취약점 없음** — 모든 의존성이 OSV.dev DB 기준 안전" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️  **${COUNT} 개 취약점 발견** — Artifacts 의 \`osv-scan-results\` 다운로드해 확인" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Private repo + GHAS 미적용 환경 — Security 탭 대신 워크플로우 Artifacts 로 결과 보존." >> "$GITHUB_STEP_SUMMARY"

  # ─── 3. Server — npm audit ─────────────────────────────────────────────
  npm-audit:
    name: npm audit — server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: install (production)
        run: npm ci --omit=dev

      - name: audit (high+ only — CI 차단)
        run: npm audit --omit=dev --audit-level=high

      - name: audit (전체 — informational)
        run: npm audit --omit=dev || true
        continue-on-error: true

  # ─── 4. Client — pub outdated (informational) ──────────────────────────
  pub-outdated:
    name: pub outdated — client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: client_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: pub get
        run: flutter pub get

      - name: pub outdated
        run: flutter pub outdated --mode=null-safety
        continue-on-error: true   # 정보성 — 차단 X

  # ─── 5. License compliance — 의존성 라이선스 매트릭스 ──────────────────
  license-check:
    name: License compatibility check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Server — license check
        working-directory: server
        run: |
          npx --yes license-checker-rseidelsohn \
            --production \
            --excludePackages 'findit-server@1.0.0' \
            --failOn 'GPL-3.0;AGPL-3.0;LGPL-3.0;SSPL-1.0;BUSL-1.1;Commons-Clause;Elastic-2.0' \
            --summary

      # Flutter pub 라이선스 검증은 별도 도구 (현재는 NOTICE 수동 관리)
