name: findit
description: "FindIt: Rebuild — find-the-difference battle game (iOS + Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # State management
  flutter_riverpod: ^2.6.1

  # i18n
  intl: ^0.19.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Image loading
  cached_network_image: ^3.4.1

  # Push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # IAP (Google Play + App Store unified)
  in_app_purchase: ^3.2.1

  # Facebook login (1.3 follow-up)
  flutter_facebook_auth: ^7.1.1

  # 공지사항 HTML 렌더 (server /notice.json 응답)
  flutter_html: ^3.0.0-beta.2

  # 라우팅 — 로그인/대기실/배틀룸 deep link
  go_router: ^14.6.2

  # 캐릭터 사진 — 카메라/앨범 (§9 ProfileScreen)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  generate: true  # enables flutter_localizations gen-l10n pipeline (uses l10n.yaml)
  assets:
    # 04-26.md §13 — 디컴파일 안드 drawable-hdpi 에서 추출한 임시 자산.
    # 디자이너 신규 에셋 입수 후 교체.
    - assets/images/items/
    - assets/images/characters/
    - assets/images/ui/

# Launcher icons (placeholder — replace assets/icon/icon.png with real artwork before release)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
